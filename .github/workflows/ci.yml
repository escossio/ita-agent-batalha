name: Certification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, unit-contract, architecture, build, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Certify without modifying tracked files
        run: bash scripts/check.sh '${{ matrix.check }}'
      - run: git diff --exit-code
